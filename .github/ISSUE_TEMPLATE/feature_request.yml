name: Feature request
description: Suggest an idea or a new app name to detect
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: When I ..., I have to ...
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: Alternatives you tried, screenshots, links.
